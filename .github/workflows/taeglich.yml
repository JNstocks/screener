name: Kursdaten aktualisieren

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Universum aktualisieren
        run: python universum_bauen.py
        continue-on-error: true
      - name: Kursdaten holen
        run: python daten_holen.py
      - name: Stammdaten holen
        run: python stammdaten_holen.py
        continue-on-error: true
      - name: Grosse 5 berechnen
        run: python grosse5_holen.py
        continue-on-error: true
      - name: Ergebnis zurueckschreiben
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add daten universum.csv
          git diff --staged --quiet || git commit -m "Daten $(date +%d.%m.%Y)"
          git push
